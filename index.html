<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام رصد وتصميم الكشوف المعتمد - النظام المدرسي المطور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #0f3d3e;
      --primary-dark: #092526;
      --gold: #b38e44;
      --gold-light: #dfba6d;
      --header-bg-tint: #f0f5f2;
      --header-text: #0f3d3e;
      --bg-app: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --border-color: #cbd5e1;
      --danger: #dc2626;
      --whatsapp: #25D366;
      --whatsapp-dark: #128C7E;
      --noor-blue: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.app-header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: #fff;
      padding: 10px 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      border-bottom: 3px solid var(--gold);
    }
    .header-container {
      max-width: 1350px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-titles h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-titles p { font-size: 0.8rem; color: var(--gold-light); }

    .tabs-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 11px;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    main.main-content {
      max-width: 1350px;
      margin: 12px auto;
      padding: 0 12px;
      flex: 1;
      width: 100%;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 3px; }
    .form-group label { font-size: 0.78rem; font-weight: 700; color: #334155; }
    .form-control {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border-color);
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      background: #fff;
      color: #1e293b;
      outline: none;
      min-height: 36px;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 61, 62, 0.1);
    }

    .class-subjects-bar {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .subjects-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .subject-chip {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .subject-chip:hover {
      background: #f1f5f9;
      border-color: var(--primary);
    }
    .subject-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(15, 61, 62, 0.25);
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
      white-space: nowrap;
      min-height: 38px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-gold { background: var(--gold); color: #18181b; }
    .btn-pdf { background: #c2410c; color: #fff; }
    .btn-success { background: #15803d; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-whatsapp { background: var(--whatsapp); color: #fff; }
    .btn-noor { background: #0284c7; color: #fff; }
    .btn-light { background: #ffffff; border: 1.5px solid #cbd5e1; color: #334155; }

    .btn-edit-sm {
      background: #fef3c7; color: #b45309; border: 1px solid #fde68a;
      padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; font-weight: 800;
    }
    .btn-delete-sm {
      background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;
      padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; font-weight: 800;
    }

    .item-list-container {
      max-height: 200px; overflow-y: auto; border: 1px solid var(--border-color);
      border-radius: 8px; padding: 6px; background: #f8fafc; margin-top: 8px;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 8px; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 6px; margin-bottom: 5px; font-size: 0.85rem;
    }

    .sheet-wrapper {
      background: #52525b; padding: 16px; display: flex; flex-direction: column;
      align-items: center; gap: 16px; overflow-x: auto; border-radius: 10px; width: 100%;
    }
    .sheet-scale-box { width: 100%; display: flex; flex-direction: column; align-items: center; }

    .a4-page {
      background: #ffffff; width: 210mm; min-height: 292mm; padding: 6mm 10mm 4mm 10mm;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25); display: flex; flex-direction: column;
      justify-content: space-between; position: relative; color: #0f172a; box-sizing: border-box;
      overflow: hidden; page-break-after: always;
    }
    .report-header {
      display: grid; grid-template-columns: 28% 46% 26%; align-items: center;
      padding-bottom: 4px; margin-bottom: 2px; border-bottom: 2px solid #0f3d3e;
    }
    .header-right { text-align: right; font-size: 10.5px; font-weight: 800; line-height: 1.4; }
    .header-center { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .header-left { text-align: left; font-size: 10px; font-weight: 800; line-height: 1.45; }
    .sub-meta-bar { display: flex; justify-content: space-between; padding: 2px 4px; font-size: 10px; font-weight: 800; border-bottom: 1.5px solid #0f3d3e; margin-bottom: 3px; }

    .grades-table, .assignments-table { width: 100%; border-collapse: collapse; font-size: 9.5px; text-align: center; }
    .grades-table th, .grades-table td, .assignments-table th, .assignments-table td { border: 1px solid #475569; padding: 3px 2px; color: #0f172a; }
    .grades-table th, .assignments-table th { background-color: var(--header-bg-tint); font-weight: 900; }
    .assignment-select { width: 100%; padding: 3px 2px; font-family: 'Cairo', sans-serif; font-size: 9px; font-weight: 700; border: 1px solid #cbd5e1; border-radius: 4px; }

    .sheet-footer { border-top: 1px solid #94a3b8; padding-top: 2px; margin-top: 2px; display: flex; justify-content: space-between; font-size: 8.5px; font-weight: 800; color: #475569; }

    @media print {
      header, .no-print, .panel-card, .tabs-nav, #admin-view, #login-modal { display: none !important; }
      .a4-page { box-shadow: none !important; margin: 0 auto !important; page-break-after: always !important; }
    }
  </style>
</head>
<body>

  <header class="app-header no-print">
    <div class="header-container">
      <div class="header-titles">
        <h1><span>📋</span><span>نظام رصد درجات الطلاب وتصميم الكشوف المعتمد</span></h1>
        <p id="top-subtitle-display">الإدارة العامة للتعليم | النظام المدرسي (ابتدائي ومتوسط)</p>
      </div>
      <div class="tabs-nav">
        <button class="tab-btn active" id="tab-roster-btn" onclick="switchView('roster')">📋 الرصد والطباعة</button>
        <button class="tab-btn" id="tab-admin-btn" onclick="requestAdminAccess()">🔒 لوحة التحكم بالإدارة</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div id="login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:999999; align-items:center; justify-content:center;">
      <div style="background:#ffffff; border-radius:14px; padding:24px; width:90%; max-width:360px; text-align:center;">
        <h3 style="margin-bottom:6px; color:var(--primary); font-weight:800;">دخول لوحة الإدارة</h3>
        <input type="password" id="admin-pass-input" class="form-control" placeholder="••••" style="text-align:center; font-size:1.3rem; margin-bottom:12px;">
        <div id="login-error" style="color:#dc2626; font-size:0.82rem; margin-bottom:12px; display:none;">⚠️ رمز الدخول خطأ (جرب: 1990)</div>
        <div style="display:flex; gap:10px;"><button class="btn btn-primary" onclick="verifyAdminPassword()" style="flex:1;">دخول</button><button class="btn btn-danger" onclick="closeAdminModal()" style="flex:1;">إلغاء</button></div>
      </div>
    </div>

    <!-- شاشة الرصد -->
    <div id="roster-view">
      <div class="panel-card no-print">
        <div class="section-title"><span>بيانات الفصل والمادة للرصد والطباعة</span></div>
        <div class="controls-grid">
          <div class="form-group"><label>المادة الدراسية:</label><select id="subject-select" class="form-control" onchange="updateRoster()"></select></div>
          <div class="form-group"><label>الصف الدراسي:</label><select id="grade-select" class="form-control" onchange="handleGradeChange()"><option value="الرابع">الرابع الابتدائي</option><option value="الخامس">الخامس الابتدائي</option><option value="السادس">السادس الابتدائي</option><option value="أول متوسط">أول متوسط</option><option value="ثاني متوسط">ثاني متوسط</option><option value="ثالث متوسط">ثالث متوسط</option></select></div>
          <div class="form-group"><label>الفصل:</label><select id="class-select" class="form-control" onchange="updateRoster()"></select></div>
          <div class="form-group"><label>معلم المادة:</label><select id="teacher-select" class="form-control" onchange="updateRoster()"></select></div>
          <div class="form-group"><label>الفترة:</label><select id="term-select" class="form-control" onchange="updateRoster()"><option value="الفترة الأولى">الفترة الأولى</option><option value="الفترة الثانية">الفترة الثانية</option></select></div>
        </div>
        <div class="class-subjects-bar"><div class="subjects-chips-container" id="class-subjects-chips"></div></div>
        <div class="action-bar"><button class="btn btn-gold" onclick="window.print()">🖨️ طباعة الكشف</button><button class="btn btn-success" onclick="exportGradesExcel()">📊 تصدير Excel</button></div>
      </div>
      <div class="sheet-wrapper"><div class="sheet-scale-box" id="printable-container"></div></div>
    </div>

    <!-- لوحة التحكم بالإدارة -->
    <div id="admin-view" style="display: none;">
      <div class="panel-card" style="border: 2px solid var(--primary);">
        <div class="section-title">
          <span>👥 جدول إسناد المواد للمعلمين</span>
          <button class="btn btn-danger" onclick="logoutAdmin()" style="padding:4px 10px; font-size:0.8rem;">قفل اللوحة</button>
        </div>
        <div style="margin-bottom:10px;"><button class="btn btn-success" onclick="saveAssignmentsMatrix()">💾 حفظ جدول الإسناد</button></div>
        <div class="sheet-wrapper" style="max-height:400px; overflow:auto;"><div id="assignments-matrix-container"></div></div>
      </div>

      <div class="panel-card">
        <div class="section-title"><span>🎓 إدارة الطلاب (استيراد إكسل وحذف وتعديل)</span><button class="btn btn-danger" onclick="clearAllStudents()">🗑️ حذف جميع الطلاب</button></div>
        <div style="background:#eef2ff; padding:10px; border-radius:8px; margin-bottom:10px;">
          <label style="font-weight:700; font-size:0.8rem;">رفع إكسل شامل لطلاب المدرسة (يدعم أكواد نور 0430 إلى 0930):</label>
          <input type="file" id="all-students-excel-file" accept=".xlsx, .xls, .csv" class="form-control" style="margin-top:4px;">
        </div>
        <div class="controls-grid">
          <div class="form-group"><label>الصف لعرض الطلاب:</label><select id="target-grade" class="form-control" onchange="handleAdminGradeChange()"><option value="الرابع">الرابع الابتدائي</option><option value="الخامس">الخامس الابتدائي</option><option value="السادس">السادس الابتدائي</option><option value="أول متوسط">أول متوسط</option><option value="ثاني متوسط">ثاني متوسط</option><option value="ثالث متوسط">ثالث متوسط</option></select></div>
          <div class="form-group"><label>الفصل:</label><select id="target-class" class="form-control" onchange="renderStudentsAdminList()"></select></div>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <input type="text" id="new-student-name" class="form-control" placeholder="اسم الطالب الجديد">
          <input type="text" id="new-student-id" class="form-control" placeholder="رقم الهوية" style="max-width:130px;">
          <button class="btn btn-primary" onclick="addSingleStudent()">إضافة طالب</button>
        </div>
        <div class="item-list-container" id="students-list-container"></div>
      </div>

      <div class="panel-card">
        <div class="section-title"><span>👨‍🏫 إدارة المعلمين (إضافة وتعديل وحذف)</span><button class="btn btn-danger" onclick="clearAllTeachers()">🗑️ حذف جميع المعلمين</button></div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <input type="text" id="new-teacher-name" class="form-control" placeholder="اسم المعلم الجديد">
          <button class="btn btn-primary" onclick="addSingleTeacher()">إضافة معلم</button>
        </div>
        <div class="item-list-container" id="teachers-list-container"></div>
      </div>
    </div>
  </main>

  <script>
    let schoolConfig = { schoolName: "المدرسة النموذجية", adminDept: "إدارة التعليم", principalName: "مدير المدرسة", schoolYear: "1447هـ" };
    
    let defaultTeachers = ["أ. ابراهيم القباني", "أ. محمد القرني", "أ. عبدالله الشهراني"];

    // قاعدة بيانات الطلاب الافتراضية الشاملة والمدمجة حصرياً في الكود
    let defaultStudents = {
      "الرابع-1": [{ name: "فهد عبدالمجيد محمد العتيبي", id: "" }, { name: "محمد سعد القحطاني", id: "" }],
      "الخامس-1": [
        { name: "احمد محي الدين عبد الله ابراهيم", id: "" },
        { name: "الامين هيثم الامين محمد", id: "" },
        { name: "أنس سعد بابكر علي", id: "" },
        { name: "أيهم سليمان يحي إبراهيم حسن", id: "" },
        { name: "حمد بن جاسر بن مبارك ال جاسر", id: "" },
        { name: "خالد هيثم الامين محمد", id: "" }
      ],
      "الخامس-2": [
        { name: "احمد بن عادل بن صالح علي", id: "1188611048" },
        { name: "أحمد عبدالقوي علي احمد غالب", id: "2448980611" },
        { name: "اسامه منصور ياسين", id: "2450271750" },
        { name: "ايمن حافظ حماد شالو", id: "2432881973" }
      ],
      "أول متوسط-1": [
        { name: "محمد فهد العتيبي", id: "1188611048" },
        { name: "سعود خالد الدوسري", id: "2448980611" }
      ]
    };

    // فرض تحميل البيانات الأساسية وتجاوز أي تخزين محلي قديم ناقص
    let teachers = defaultTeachers;
    let studentsData = defaultStudents;
    let recordedGrades = JSON.parse(localStorage.getItem('sys_grades')) || {};
    let teacherAssignments = JSON.parse(localStorage.getItem('sys_assignments')) || {};

    const primarySubjects = ["الرياضيات", "اللغة العربية (لغتي الجميلة)", "العلوم", "اللغة الإنجليزية", "القرآن الكريم والدراسات الإسلامية", "الدراسات الاجتماعية", "المهارات الرقمية", "التربية الفنية", "التربية البدنية"];
    const intermediateSubjects = ["الرياضيات", "اللغة العربية (لغتي الخالدة)", "العلوم", "اللغة الإنجليزية", "الدراسات الإسلامية", "الدراسات الاجتماعية", "المهارات الرقمية", "التفكير الناقد", "التربية الفنية", "التربية البدنية"];

    function getSubjects(grade) {
      if (grade && grade.includes('متوسط')) return intermediateSubjects;
      return primarySubjects;
    }

    function getStudentName(st) { return typeof st === 'object' && st !== null ? (st.name || '') : String(st || ''); }
    function getStudentID(st) { return typeof st === 'object' && st !== null ? (st.id || '') : ''; }

    function saveState() {
      localStorage.setItem('sys_teachers', JSON.stringify(teachers));
      localStorage.setItem('sys_students', JSON.stringify(studentsData));
      localStorage.setItem('sys_grades', JSON.stringify(recordedGrades));
      localStorage.setItem('sys_assignments', JSON.stringify(teacherAssignments));
    }

    function getActiveClasses() {
      let list = [];
      const grades = ["الرابع", "الخامس", "السادس", "أول متوسط", "ثاني متوسط", "ثالث متوسط"];
      grades.forEach(g => {
        let maxC = 1;
        for (let c = 1; c <= 5; c++) {
          if (studentsData[`${g}-${c}`] && studentsData[`${g}-${c}`].length > 0) maxC = Math.max(maxC, c);
        }
        for (let i = 1; i <= maxC; i++) {
          list.push({ grade: g, classNum: String(i), label: `${g} / ${i}` });
        }
      });
      if (list.length === 0) list.push({ grade: "الخامس", classNum: "1", label: "الخامس / 1" });
      return list;
    }

    function updateClassSelectOptions(gradeId, classId) {
      const g = document.getElementById(gradeId).value;
      const cSel = document.getElementById(classId);
      if (!cSel) return;
      const cur = cSel.value;
      cSel.innerHTML = '';
      let found = [];
      for (let i = 1; i <= 5; i++) {
        if (studentsData[`${g}-${i}`] && studentsData[`${g}-${i}`].length > 0) found.push(String(i));
      }
      if (found.length === 0) found = ["1", "2"];
      found.forEach(i => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `فصل (${i})`;
        cSel.appendChild(opt);
      });
      cSel.value = found.includes(cur) ? cur : found[0];
    }

    function updateSubjectsDropdown() {
      const g = document.getElementById('grade-select').value;
      const sSel = document.getElementById('subject-select');
      if (!sSel) return;
      const cur = sSel.value;
      const subs = getSubjects(g);
      sSel.innerHTML = '';
      subs.forEach(s => {
        let opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sSel.appendChild(opt);
      });
      if (subs.includes(cur)) sSel.value = cur;
    }

    function handleGradeChange() {
      updateSubjectsDropdown();
      updateClassSelectOptions('grade-select', 'class-select');
      updateRoster();
    }

    function handleAdminGradeChange() {
      updateClassSelectOptions('target-grade', 'target-class');
      renderStudentsAdminList();
    }

    function switchView(v) {
      document.getElementById('roster-view').style.display = (v === 'roster') ? 'block' : 'none';
      document.getElementById('admin-view').style.display = (v === 'admin') ? 'block' : 'none';
      document.getElementById('tab-roster-btn').classList.toggle('active', v === 'roster');
      document.getElementById('tab-admin-btn').classList.toggle('active', v === 'admin');
      if (v === 'roster') { updateSubjectsDropdown(); updateClassSelectOptions('grade-select', 'class-select'); updateRoster(); }
      else if (v === 'admin') { renderTeachersAdminList(); handleAdminGradeChange(); renderAssignmentsMatrix(); }
    }

    function requestAdminAccess() {
      if (window.isAdmin) { switchView('admin'); return; }
      document.getElementById('login-modal').style.display = 'flex';
    }
    function closeAdminModal() { document.getElementById('login-modal').style.display = 'none'; }
    function verifyAdminPassword() {
      if (document.getElementById('admin-pass-input').value.trim() === '1990') {
        window.isAdmin = true;
        closeAdminModal();
        switchView('admin');
      } else { document.getElementById('login-error').style.display = 'block'; }
    }
    function logoutAdmin() { window.isAdmin = false; switchView('roster'); }

    function renderTeachersAdminList() {
      const container = document.getElementById('teachers-list-container');
      const tSelect = document.getElementById('teacher-select');
      container.innerHTML = '';
      if (tSelect) tSelect.innerHTML = '';

      teachers.forEach((t, idx) => {
        container.innerHTML += `
          <div class="item-row">
            <span>${idx + 1}. ${t}</span>
            <div>
              <button class="btn-edit-sm" onclick="editTeacher(${idx})">تعديل</button>
              <button class="btn-delete-sm" onclick="deleteTeacher(${idx})">حذف</button>
            </div>
          </div>
        `;
        if (tSelect) tSelect.innerHTML += `<option value="${t}">${t}</option>`;
      });
    }

    function addSingleTeacher() {
      const input = document.getElementById('new-teacher-name');
      const name = input.value.trim();
      if (!name) return;
      if (!teachers.includes(name)) {
        teachers.push(name);
        saveState();
        renderTeachersAdminList();
        input.value = '';
      } else { alert("المعلم موجود مسبقاً!"); }
    }

    function editTeacher(idx) {
      const oldName = teachers[idx];
      const newName = prompt("تعديل اسم المعلم:", oldName);
      if (newName && newName.trim() && newName.trim() !== oldName) {
        teachers[idx] = newName.trim();
        saveState();
        renderTeachersAdminList();
        alert("✓ تم التعديل بنجاح!");
      }
    }

    function deleteTeacher(idx) {
      if (confirm(`حذف المعلم ${teachers[idx]}؟`)) {
        teachers.splice(idx, 1);
        saveState();
        renderTeachersAdminList();
      }
    }

    function clearAllTeachers() {
      if (confirm("⚠️ هل أنت متأكد من حذف جميع المعلمين؟")) {
        teachers = [];
        saveState();
        renderTeachersAdminList();
      }
    }

    function renderStudentsAdminList() {
      const g = document.getElementById('target-grade').value;
      const c = document.getElementById('target-class').value;
      const key = `${g}-${c}`;
      const list = studentsData[key] || [];
      const container = document.getElementById('students-list-container');
      container.innerHTML = '';

      list.forEach((st, idx) => {
        container.innerHTML += `
          <div class="item-row">
            <span>${idx + 1}. ${getStudentName(st)} ${getStudentID(st) ? `(هوية: ${getStudentID(st)})` : ''}</span>
            <button class="btn-delete-sm" onclick="deleteStudent('${key}', ${idx})">حذف</button>
          </div>
        `;
      });
    }

    function addSingleStudent() {
      const g = document.getElementById('target-grade').value;
      const c = document.getElementById('target-class').value;
      const key = `${g}-${c}`;
      const nameInput = document.getElementById('new-student-name');
      const idInput = document.getElementById('new-student-id');
      const name = nameInput.value.trim();
      if (!name) return;
      if (!studentsData[key]) studentsData[key] = [];
      studentsData[key].push({ name: name, id: idInput.value.trim() });
      saveState();
      renderStudentsAdminList();
      nameInput.value = ''; idInput.value = '';
    }

    function deleteStudent(key, idx) {
      if (confirm("حذف الطالب المحدد؟")) {
        studentsData[key].splice(idx, 1);
        saveState();
        renderStudentsAdminList();
      }
    }

    function clearAllStudents() {
      if (confirm("⚠️ هل أنت متأكد من حذف جميع طلاب المدرسة؟")) {
        studentsData = {};
        saveState();
        renderStudentsAdminList();
      }
    }

    function renderAssignmentsMatrix() {
      const container = document.getElementById('assignments-matrix-container');
      const classes = getActiveClasses();
      const subs = primarySubjects;

      let headers = '<th>الصف والفصل</th>';
      subs.forEach(s => headers += `<th>${s}</th>`);

      let rows = '';
      classes.forEach(cObj => {
        const classKey = `${cObj.grade}-${cObj.classNum}`;
        let tds = '';
        subs.forEach(s => {
          const assignKey = `${classKey}_${s}`;
          const curT = teacherAssignments[assignKey] || '';
          let opts = '<option value="">-- اختر --</option>';
          teachers.forEach(t => opts += `<option value="${t}" ${t === curT ? 'selected' : ''}>${t}</option>`);
          tds += `<td><select class="assignment-select" data-key="${assignKey}">${opts}</select></td>`;
        });
        rows += `<tr><td style="font-weight:bold;">${cObj.label}</td>${tds}</tr>`;
      });

      container.innerHTML = `<table class="assignments-table"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function saveAssignmentsMatrix() {
      document.querySelectorAll('.assignment-select').forEach(sel => {
        const k = sel.getAttribute('data-key');
        if (sel.value) teacherAssignments[k] = sel.value;
        else delete teacherAssignments[k];
      });
      saveState();
      alert("✓ تم حفظ جدول إسناد المواد بنجاح!");
    }

    document.getElementById('all-students-excel-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1, defval: ""});
        
        let count = 0;
        rows.forEach(row => {
          let classRaw = String(row[2] || "").trim();
          let gradeCode = String(row[3] || "").trim();
          let name = String(row[4] || "").trim();
          let studentId = String(row[5] || "").trim();

          if (name && name !== "اسم الطالب" && name.length > 2) {
            let grade = "الخامس";
            if (gradeCode.includes("0430") || gradeCode.includes("رابع")) grade = "الرابع";
            else if (gradeCode.includes("0530") || gradeCode.includes("خامس")) grade = "الخامس";
            else if (gradeCode.includes("0630") || gradeCode.includes("سادس")) grade = "السادس";
            else if (gradeCode.includes("0730") || gradeCode.includes("أول متوسط")) grade = "أول متوسط";
            else if (gradeCode.includes("0830") || gradeCode.includes("ثاني متوسط")) grade = "ثاني متوسط";
            else if (gradeCode.includes("0930") || gradeCode.includes("ثالث متوسط")) grade = "ثالث متوسط";

            let classNum = classRaw.replace(/[^0-9]/g, '') || "1";
            const key = `${grade}-${classNum}`;
            if (!studentsData[key]) studentsData[key] = [];

            if (!studentsData[key].some(s => getStudentName(s) === name)) {
              studentsData[key].push({ name: name, id: studentId });
              count++;
            }
          }
        });

        saveState();
        renderStudentsAdminList();
        renderAssignmentsMatrix();
        alert(`تم استيراد وتوزيع (${count}) طالباً بنجاح!`);
      };
      reader.readAsArrayBuffer(file);
    });

    function updateRoster() {
      const g = document.getElementById('grade-select').value;
      const c = document.getElementById('class-select').value;
      const sub = document.getElementById('subject-select').value;
      const teacher = document.getElementById('teacher-select').value;
      const list = studentsData[`${g}-${c}`] || [];
      const container = document.getElementById('printable-container');
      container.innerHTML = '';

      let rows = '';
      for (let i = 0; i < Math.max(list.length, 25); i++) {
        rows += `<tr><td>${i+1}</td><td style="text-align:right; padding-right:8px;">${getStudentName(list[i])}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }

      container.innerHTML = `
        <div class="a4-page">
          <div class="report-header">
            <div class="header-right">المملكة العربية السعودية<br>وزارة التعليم<br>${schoolConfig.schoolName}</div>
            <div class="header-center"><h2>كشف رصد درجات الطلاب</h2></div>
            <div class="header-left">المادة: ${sub}<br>الصف: ${g}<br>الفصل: ${c}</div>
          </div>
          <div style="margin:6px 0; font-weight:800; font-size:10px;">معلم المادة: ${teacher || '—'}</div>
          <table class="grades-table">
            <thead><tr><th>م</th><th>اسم الطالب</th><th>المهام (40)</th><th>تقويمات (20)</th><th>اختبار (40)</th><th>المجموع</th><th>ملاحظات</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="sheet-footer"><div>${schoolConfig.schoolName}</div><div>توقيع المعلم: ....................</div></div>
        </div>
      `;
    }

    function exportGradesExcel() {
      const g = document.getElementById('grade-select').value;
      const c = document.getElementById('class-select').value;
      const list = studentsData[`${g}-${c}`] || [];
      const data = list.map((st, i) => ({ "م": i + 1, "اسم الطالب": getStudentName(st), "رقم الهوية": getStudentID(st) }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "الدرجات");
      XLSX.writeFile(wb, `كشف_${g}_${c}.xlsx`);
    }

    // تهيئة أولية
    renderTeachersAdminList();
    updateSubjectsDropdown();
    updateClassSelectOptions('grade-select', 'class-select');
    updateRoster();
  </script>
</body>
</html>
